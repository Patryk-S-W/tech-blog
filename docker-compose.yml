name: tech-blog

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: techblog
      POSTGRES_USER: techblog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techblog -d techblog"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: tech-blog-backend:${RELEASE:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres_Db: "Host=postgres;Database=techblog;Username=techblog;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      AppSettings__Token: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: tech-blog-frontend:${RELEASE:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    environment:
      BACKEND_UPSTREAM: backend:8080
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
